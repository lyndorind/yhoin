name: PR Build & Package

on:
  pull_request:
    branches:
      - main

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build package and generate SHA-256 checksum
        run: |
          mkdir -p dist
          PKG_FILE=$(npm pack --pack-destination dist | tail -n 1)
          cd dist
          sha256sum "$PKG_FILE" > "${PKG_FILE}.sha256"
          ls -la

      - name: Upload package and SHA-256 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-package-artifacts
          path: dist/*
          retention-days: 7
